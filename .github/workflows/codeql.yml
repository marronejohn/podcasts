name: CodeQL

on:
  push:
  schedule:
    - cron: '37 4 * * 1'  # Runs at 04:37, only on Monday

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null || true
      - uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: none
      - name: Compile check
        run: mkdir -p obj && find src -name '*.java' > sources.txt && javac -source 17 -target 17 -classpath "$ANDROID_HOME/platforms/android-34/android.jar" -d obj @sources.txt
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
          

