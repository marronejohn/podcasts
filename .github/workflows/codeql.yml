name: CodeQL
on:
  push:
  schedule:
    - cron: '37 4 * * 1'
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null || true
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build (compile only, no signing)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.* | head -1)
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          $BT/aapt2 compile --dir res -o res.zip
          $BT/aapt2 link -o unsigned.apk -I $AJ --manifest AndroidManifest.xml --min-sdk-version 21 --target-sdk-version 34 res.zip
          mkdir -p classes
          javac -source 1.8 -target 1.8 -classpath $AJ -d classes src/au/com/jmarrone/podcasts/*.java
      - uses: github/codeql-action/analyze@v3
      

